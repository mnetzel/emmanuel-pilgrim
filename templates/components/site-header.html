<header class="site-header">
  <a class="site-brand" href="{{ url('index.html') }}"{% if route.section == 'welcome' %} aria-current="page"{% endif %}>{{ site.name }}</a>
  <button class="menu-toggle" type="button" aria-controls="primary-navigation" aria-expanded="false" aria-label="Open navigation">
    <span class="menu-toggle-icon" aria-hidden="true"></span>
  </button>
  <nav id="primary-navigation" class="primary-navigation" aria-label="Main navigation">
    <ul>
      {% for item in site.navigation %}
      <li><a href="{{ url(item.path) }}"{% if item.path == active_navigation %} aria-current="{{ 'page' if item.path == route.path else 'true' }}"{% endif %}>{{ item.label }}</a></li>
      {% endfor %}
    </ul>
  </nav>
</header>
